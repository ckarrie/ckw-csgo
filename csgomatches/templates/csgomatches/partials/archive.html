<div class="boxed archive">
    <ul class="archive__list">
        <li class="archive__list-item">
            <a class="archive__link {% if current_view == "index" %}is-active{% endif %}"
               href="{% url "match_upcoming" %}">Kommende Matches</a>
        </li>
        {% for date in date_list %}
            <li class="archive__list-item">
                <a class="archive__link {% if year.year == date.year %}is-active{% endif %}"
                   href="{% url "match_history" year=date.year %}">{{ date|date:"Y" }}</a>
            </li>
        {% endfor %}
    </ul>
</div>
